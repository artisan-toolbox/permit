name: tests

on:
  push:
    branches:
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - L13.* - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI dependencies
        uses: artisan-toolbox/maintainer@498f5f8723cbed3d24af0ba90870ca26010db4df # 1.14.2
        with:
          php-version: ${{ matrix.php }}
          php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          composer-mode: ${{ matrix.stability }}
          composer-validation: no-check-lock
          composer-scripts: 'false'
          node-version: '24'
          npm-cache: 'true'
          npm-install: 'false'

      - name: Discover Testbench packages
        run: composer run prepare

      - name: Check shared agent standards
        run: npm run standards:check

      - name: Install frontend dependencies
        run: npm ci

      - name: Run configured quality checks
        run: php vendor/bin/maintainer quality:check --no-interaction

      - name: Check PHP type coverage
        run: composer test:types

      - name: Build frontend distribution
        run: npm run build

      - name: Verify frontend distribution imports
        run: npm run check:dist

      - name: Check committed frontend distribution
        run: git diff --exit-code -- dist

  authorization-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: pgsql
            cache: redis
          - database: mariadb
            cache: memcached

    name: Authorization with ${{ matrix.database }} and ${{ matrix.cache }}

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: permit_testing
          POSTGRES_USER: permit_test
          POSTGRES_PASSWORD: permit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permit_test -d permit_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_DATABASE: permit_testing
          MARIADB_USER: permit_test
          MARIADB_PASSWORD: permit_test
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: ${{ matrix.cache == 'redis' && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      memcached:
        image: ${{ matrix.cache == 'memcached' && 'memcached:1.6-alpine' || '' }}
        ports:
          - 11211:11211
        options: >-
          --health-cmd "printf 'version\r\nquit\r\n' | nc -w 2 127.0.0.1 11211 | grep -q '^VERSION '"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI dependencies
        uses: artisan-toolbox/maintainer@498f5f8723cbed3d24af0ba90870ca26010db4df # 1.14.2
        with:
          php-extensions: intl, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, memcached

      - name: Test authorization against shared services
        env:
          PERMIT_INTEGRATION_DB: ${{ matrix.database }}
          PERMIT_INTEGRATION_CACHE: ${{ matrix.cache }}
        run: php vendor/bin/pest tests/Feature/AuthorizationIntegrationTest.php
